# Small fixture for fast iteration. ~50KB / ~14K tokens — fits in any context.
# 11 named functions with ≥20 body lines.

[files]
directory = "fixtures"
glob = "http_server.py"
limit = 1

[sample]
k = 16    # falls back to all 7 after min_code_lines filtering
seed = 42
min_code_lines = 5

[scoring]
count_comments = true
relax_indent = false
pass_ratio = 0.7
